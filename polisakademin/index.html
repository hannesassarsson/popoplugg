            <div className="card p-5">
              <h3 className="font-semibold mb-3 text-emerald-400">Starkaste lag</h3>
              <ul className="space-y-2 text-sm">
                <li className="flex justify-between"><span>Polislagen 13 §</span><span className="text-emerald-400">94%</span></li>
                <li className="flex justify-between"><span>LOB</span><span className="text-emerald-400">89%</span></li>
                <li className="flex justify-between"><span>Knivlagen</span><span className="text-emerald-400">87%</span></li>
              </ul>
            </div>
          </div>
        </div>
      );

      const renderCourses = () => (
        <div className="space-y-6 fade-in">
          <div><h1 className="text-2xl font-bold">Kurser</h1><p className="text-slate-400">Strukturerade lektioner i svensk polisjuridik</p></div>
          <div className="grid sm:grid-cols-2 gap-4">
            {COURSES.map(c => (
              <div key={c.id} className="card card-hover p-5 cursor-pointer" onClick={() => { addXp(5); go('quiz'); }}>
                <div className="flex gap-4">
                  <div className="text-3xl">{c.icon}</div>
                  <div className="flex-1">
                    <h3 className="font-semibold mb-1">{c.title}</h3>
                    <p className="text-sm text-slate-400 mb-3">{c.desc}</p>
                    <div className="flex gap-3 text-xs text-slate-500">
                      <span>{c.lessons} lektioner</span>
                      <span>~{c.minutes} min</span>
                    </div>
                    <div className="mt-3 progress-bar"><div className="progress-fill" style={{ width: `${Math.random()*60+20}%` }} /></div>
                  </div>
                </div>
              </div>
            ))}

          <div className="card p-5">
            <h2 className="font-semibold mb-4">Snabbquiz – testa dig</h2>
            <button onClick={() => { setQuizIdx(0); setQuizAnswer(null); setQuizScore(0); go('quiz'); }} className="btn-primary">Starta quiz (6 frågor)</button>
          </div>
        </div>
      );

      const renderQuiz = () => {
        const q = QUIZ_BANK[quizIdx];
        if (!q) {
          return (
            <div className="card p-8 text-center fade-in">
              <h2 className="text-2xl font-bold mb-2">Quiz klart!</h2>
              <p className="text-4xl font-bold text-police-400 mb-2">{quizScore}/{QUIZ_BANK.length}</p>
              <p className="text-slate-400 mb-6">+{quizScore * 10} XP</p>
              <button onClick={() => go('courses')} className="btn-primary">Tillbaka till kurser</button>
            </div>
          );
        }
        return (
          <div className="space-y-6 fade-in max-w-xl mx-auto">
            <div className="flex justify-between text-sm text-slate-400">
              <span>Fråga {quizIdx + 1}/{QUIZ_BANK.length}</span>
              <span>Poäng: {quizScore}</span>
            </div>
            <div className="progress-bar"><div className="progress-fill" style={{ width: `${((quizIdx)/QUIZ_BANK.length)*100}%` }} /></div>

              <div className="space-y-2">

                  let cls = 'w-full text-left p-4 rounded-xl border border-slate-700 hover:border-police-500/50 transition';
                  if (quizAnswer !== null) {
                    if (opt === q.correct) cls += ' bg-emerald-500/20 border-emerald-500/50';
                    else if (opt === quizAnswer) cls += ' bg-rose-500/20 border-rose-500/50';
                  }
                  return (
                    <button key={opt} disabled={quizAnswer !== null} onClick={() => {
                      setQuizAnswer(opt);
                      const correct = opt === q.correct;
                      if (correct) { setQuizScore(s => s + 1); addXp(10); }
                      setProgress(p => ({ ...p, correct: p.correct + (correct?1:0), total: p.total + 1 }));
                    }} className={cls}>{opt}</button>
                  );
                })}
              </div>
              {quizAnswer !== null && (
                <div className="mt-4 p-4 rounded-xl bg-slate-800/80 text-sm">
                  <p className="font-medium mb-1">{quizAnswer === q.correct ? '✅ Rätt!' : '❌ Fel'}</p>
                  <p className="text-slate-400">{q.explanation}</p>
                  <p className="text-xs text-police-400 mt-2">{q.law}</p>
                  <button onClick={() => { setQuizIdx(i => i + 1); setQuizAnswer(null); }} className="btn-primary mt-4 text-sm">Nästa</button>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderScenarios = () => {
        if (selectedScenario) {
          const sc = SCENARIOS.find(s => s.id === selectedScenario);
          if (scenarioFeedback) {
            return (
              <div className="space-y-6 fade-in max-w-2xl mx-auto">
                <button onClick={() => { setSelectedScenario(null); setScenarioFeedback(null); setScenarioAnswers({}); setScenarioStep(0); }} className="text-sm text-slate-400 hover:text-white">← Tillbaka</button>
                <div className="card p-6 text-center">
                  <p className="text-sm text-slate-400 mb-1">Din poäng</p>
                  <p className="text-5xl font-bold text-police-400 mb-2">{scenarioFeedback.score}</p>
                  <p className="text-slate-400">+{Math.round(scenarioFeedback.score/2)} XP</p>
                </div>
                <div className="card p-5 space-y-3">
                  <h3 className="font-semibold text-emerald-400">Vad du gjorde bra</h3>
                  {scenarioFeedback.points.map((p,i) => <p key={i} className="text-sm text-slate-300">• {p}</p>)}
                </div>
                <div className="card p-5 space-y-2">
                  <h3 className="font-semibold">Rätt lag & paragraf</h3>
                  <p className="text-police-400 font-medium">{scenarioFeedback.law} – {scenarioFeedback.paragraph}</p>
                  <h4 className="font-medium mt-3 text-sm">Nyckelpunkter</h4>
                  {scenarioFeedback.keyPoints.map((k,i) => <p key={i} className="text-sm text-slate-400">• {k}</p>)}
                  <h4 className="font-medium mt-3 text-sm">Alternativ</h4>
                  {scenarioFeedback.alternatives.map((a,i) => <p key={i} className="text-sm text-slate-400">• {a}</p>)}
                  <h4 className="font-medium mt-3 text-sm">Proportionalitet</h4>
                  <p className="text-sm text-slate-400">{scenarioFeedback.proportionality}</p>
                </div>
                <button onClick={() => { setSelectedScenario(null); setScenarioFeedback(null); setScenarioAnswers({}); setScenarioStep(0); go('scenarios'); }} className="btn-primary w-full">Tillbaka till scenarier</button>
              </div>
            );
          }
          const q = sc.questions[scenarioStep];
          return (
            <div className="space-y-6 fade-in max-w-2xl mx-auto">
              <button onClick={() => { setSelectedScenario(null); setScenarioStep(0); setScenarioAnswers({}); }} className="text-sm text-slate-400 hover:text-white">← Tillbaka</button>
              <div className="card p-5">
                <h2 className="font-bold text-lg mb-2">{sc.title}</h2>
                <p className="text-slate-300 text-sm leading-relaxed">{sc.situation}</p>
                <p className="text-xs text-slate-500 mt-2">{sc.context}</p>
              </div>
              <div className="card p-5">
                <p className="text-xs text-slate-500 mb-1">Fråga {scenarioStep + 1}/{sc.questions.length}</p>
                <h3 className="font-semibold mb-4">{q.prompt}</h3>
                <textarea
                  className="input-field min-h-[100px] mb-4"
                  placeholder="Skriv ditt resonemang..."
                  value={scenarioAnswers[q.id] || ''}
                  onChange={e => setScenarioAnswers(a => ({ ...a, [q.id]: e.target.value }))}
                />
                <button
                  className="btn-primary"
                  disabled={!scenarioAnswers[q.id]?.trim()}
                  onClick={() => {
                    if (scenarioStep < sc.questions.length - 1) {
                      setScenarioStep(s => s + 1);
                    } else {
                      const fb = generateScenarioFeedback(sc, scenarioAnswers);
                      setScenarioFeedback(fb);
                      addXp(Math.round(fb.score / 2));
                      setProgress(p => ({ ...p, lessons: p.lessons + 1, dailyProgress: p.dailyProgress + 1 }));
                    }
                  }}
                >
                  {scenarioStep < sc.questions.length - 1 ? 'Nästa fråga' : 'Få feedback'}
                </button>
              </div>
            </div>
          );
        }
        return (
          <div className="space-y-6 fade-in">
            <div><h1 className="text-2xl font-bold">Scenarier</h1><p className="text-slate-400">Realistiska polisärenden – det viktigaste i appen</p></div>
            <div className="space-y-3">
              {SCENARIOS.map(s => (
                <div key={s.id} className="card card-hover p-5 cursor-pointer" onClick={() => { setSelectedScenario(s.id); setScenarioStep(0); setScenarioAnswers({}); setScenarioFeedback(null); }}>
                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="font-semibold mb-1">{s.title}</h3>
                      <p className="text-sm text-slate-400 line-clamp-2">{s.situation.slice(0,120)}...</p>
                      <p className="text-xs text-police-400 mt-2">{s.correctLaw} · {s.correctParagraph}</p>
                    </div>
                    <Icon name="chevron" size={20} className="text-slate-600 flex-shrink-0" />
                  </div>
                </div>
              ))}
            </div>
          </div>
        );

              <p className="text-lg font-medium whitespace-pre-line">{fcFlipped ? card.back : card.front}</p>
              {fcFlipped && <p className="text-xs text-police-400 mt-4">{card.tags.join(' · ')}</p>}

            <div className="flex gap-2 justify-center">
              {['Svår', 'Osäker', 'Bra', 'Lätt'].map((label, i) => (

                  addXp(i + 2);
                }} className={`px-4 py-2 rounded-xl text-sm font-medium ${i < 2 ? 'bg-slate-800 text-slate-300' : 'bg-police-600/30 text-police-300'}`}>
                  {label}
                </button>
              ))}
            </div>
            <p className="text-center text-sm text-slate-500">{(fcIndex % FLASHCARDS.length) + 1} / {FLASHCARDS.length}</p>
          </div>
        );
      };

                <h3 className="font-semibold mb-2">Förklaring</h3>
                <p className="text-sm text-slate-400 mb-4">{p.explanation}</p>
                <h3 className="font-semibold mb-2">Exempel</h3>
                <ul className="text-sm text-slate-400 space-y-1 mb-4">{p.examples.map((e,i) => <li key={i}>• {e}</li>)}</ul>
                <h3 className="font-semibold mb-2">Praktiska tips</h3>
                <ul className="text-sm text-slate-400 space-y-1 mb-4">{p.tips.map((t,i) => <li key={i}>• {t}</li>)}</ul>
                <h3 className="font-semibold mb-2">Egna anteckningar</h3>
                <textarea className="input-field min-h-[80px]" placeholder="Skriv dina anteckningar här..." value={progress.notes[p.id] || ''} onChange={e => setProgress(pr => ({ ...pr, notes: { ...pr.notes, [p.id]: e.target.value } }))} />

                  className="btn-secondary text-sm mt-3"

                    const fav = pr.favorites.paragraphs.includes(p.id)
                      ? pr.favorites.paragraphs.filter(x => x !== p.id)
                      : [...pr.favorites.paragraphs, p.id];
                    return { ...pr, favorites: { ...pr.favorites, paragraphs: fav } };
                  })}
                >
                  {progress.favorites.paragraphs.includes(p.id) ? '★ Sparad' : '☆ Spara favorit'}
                </button>
              </div>
            </div>
          );
        }
        if (selectedLaw) {
          const law = LAWS.find(l => l.id === selectedLaw);
          return (
            <div className="space-y-6 fade-in">
              <button onClick={() => setSelectedLaw(null)} className="text-sm text-slate-400 hover:text-white">← Alla lagar</button>
              <div className="card p-6">
                <h1 className="text-2xl font-bold mb-1">{law.name}</h1>
                <p className="text-slate-400 mb-4">{law.desc}</p>
                <h3 className="font-semibold text-amber-400 mb-2 text-sm">Vanliga misstag</h3>
                <ul className="text-sm text-slate-400 space-y-1">{law.mistakes.map((m,i) => <li key={i}>• {m}</li>)}</ul>
              </div>
              <div className="space-y-2">
                {law.paragraphs.map(p => (
                  <div key={p.id} className="card card-hover p-4 cursor-pointer" onClick={() => setSelectedParagraph(p.id)}>
                    <p className="font-medium">{p.num} – {p.title}</p>
                    <p className="text-sm text-slate-500 line-clamp-1">{p.explanation}</p>
                  </div>
                ))}
              </div>
            </div>
          );
        }
        return (
          <div className="space-y-6 fade-in">
            <div><h1 className="text-2xl font-bold">Lagbibliotek</h1><p className="text-slate-400">Sammanfattningar, paragrafer, exempel och tips</p></div>
            <div className="grid sm:grid-cols-2 gap-4">
              {LAWS.map(l => (
                <div key={l.id} className="card card-hover p-5 cursor-pointer" onClick={() => setSelectedLaw(l.id)}>
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="badge bg-police-600/20 text-police-300 text-xs px-2 py-0.5 rounded-full">{l.short}</span>
                      <h3 className="font-semibold mt-2">{l.name}</h3>
                      <p className="text-sm text-slate-400 mt-1">{l.desc}</p>
                      <p className="text-xs text-slate-500 mt-2">{l.paragraphs.length} paragrafer</p>
                    </div>
                    <Icon name="chevron" size={20} className="text-slate-600" />
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderStats = () => (
        <div className="space-y-6 fade-in">
          <div><h1 className="text-2xl font-bold">Statistik</h1><p className="text-slate-400">Din utveckling över tid</p></div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="card p-4 text-center"><p className="text-2xl font-bold">{progress.minutes}</p><p className="text-xs text-slate-400">Studieminuter</p></div>
            <div className="card p-4 text-center"><p className="text-2xl font-bold text-emerald-400">{progress.correct}</p><p className="text-xs text-slate-400">Rätt svar</p></div>
            <div className="card p-4 text-center"><p className="text-2xl font-bold text-rose-400">{progress.total - progress.correct}</p><p className="text-xs text-slate-400">Fel svar</p></div>
            <div className="card p-4 text-center"><p className="text-2xl font-bold">{accuracy}%</p><p className="text-xs text-slate-400">Träffsäkerhet</p></div>
          </div>
          <div className="card p-5">
            <h3 className="font-semibold mb-3">XP & Nivå</h3>
            <p className="text-3xl font-bold text-police-400 mb-1">{progress.xp} XP</p>
            <p className="text-sm text-slate-400 mb-3">Nivå {progress.level}</p>
            <div className="progress-bar h-3"><div className="progress-fill" style={{ width: `${(progress.xp % 100)}%` }} /></div>
          </div>
          <div className="card p-5">
            <h3 className="font-semibold mb-3">Streak</h3>
            <div className="flex items-center gap-3">
              <Icon name="flame" size={32} className="text-amber-400" />
              <div>
                <p className="text-2xl font-bold">{progress.streak} dagar</p>
                <p className="text-sm text-slate-400">Studera idag för att behålla streaken</p>
              </div>
            </div>
          </div>
        </div>
      );

      const renderAI = () => (
        <div className="space-y-4 fade-in flex flex-col h-[calc(100vh-8rem)]">
          <div><h1 className="text-2xl font-bold">AI-lärare</h1><p className="text-slate-400">Sokratisk metod – ingen facit direkt</p></div>
          <div className="card flex-1 overflow-y-auto p-4 space-y-3">
            {aiMessages.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-line ${m.role === 'user' ? 'bg-police-600 text-white' : 'bg-slate-800 text-slate-200'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input className="input-field flex-1" placeholder="Skriv din fråga eller resonemang..." value={aiInput} onChange={e => setAiInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && sendAi()} />
            <button onClick={sendAi} className="btn-primary px-4">Skicka</button>
          </div>
        </div>
      );

      const renderFavorites = () => (
        <div className="space-y-6 fade-in">
          <div><h1 className="text-2xl font-bold">Favoriter</h1><p className="text-slate-400">Sparade scenarier, paragrafer och kort</p></div>
          <div className="card p-5">
            <h3 className="font-semibold mb-3">Paragrafer</h3>
            {progress.favorites.paragraphs.length === 0 ? <p className="text-sm text-slate-500">Inga sparade ännu</p> :
              progress.favorites.paragraphs.map(id => {
                const law = LAWS.find(l => l.paragraphs.some(p => p.id === id));
                const p = law?.paragraphs.find(x => x.id === id);
                return p ? <button key={id} onClick={() => { setSelectedLaw(law.id); setSelectedParagraph(id); go('laws'); }} className="block w-full text-left p-3 rounded-xl hover:bg-slate-800 text-sm mb-1">{law.short} {p.num} – {p.title}</button> : null;
              })
            }
          </div>
          <div className="card p-5">
            <h3 className="font-semibold mb-3">Scenarier</h3>
            {progress.favorites.scenarios.map(id => {
              const s = SCENARIOS.find(x => x.id === id);
              return s ? <button key={id} onClick={() => { setSelectedScenario(id); go('scenarios'); }} className="block w-full text-left p-3 rounded-xl hover:bg-slate-800 text-sm mb-1">{s.title}</button> : null;
            })}
          </div>
        </div>
      );

      const renderSearch = () => (
        <div className="space-y-6 fade-in">
          <div><h1 className="text-2xl font-bold">Sök</h1><p className="text-slate-400">Paragrafer, lagar, brott, begrepp</p></div>
          <input className="input-field text-lg" placeholder="Sök t.ex. '13 §', 'LOB', 'misshandel'..." value={searchQ} onChange={e => setSearchQ(e.target.value)} autoFocus />
          <div className="space-y-2">
            {searchResults.map((r, i) => (
              <div key={i} className="card card-hover p-4 cursor-pointer" onClick={() => {
                if (r.type === 'lag') { setSelectedLaw(r.id); go('laws'); }
                else if (r.type === 'paragraf') { setSelectedLaw(r.lawId); setSelectedParagraph(r.id); go('laws'); }
                else if (r.type === 'scenario') { setSelectedScenario(r.id); go('scenarios'); }
                else if (r.type === 'flashcard') go('flashcards');
              }}>
                <span className="text-xs text-slate-500 uppercase">{r.type}</span>
                <p className="font-medium">{r.title}</p>
                <p className="text-sm text-slate-400">{r.subtitle}</p>
              </div>
            ))}
            {searchQ && searchResults.length === 0 && <p className="text-slate-500 text-center py-8">Inga träffar</p>}
          </div>
        </div>
      );

      const renderAdmin = () => (
        <div className="space-y-6 fade-in">
          <div><h1 className="text-2xl font-bold">Admin</h1><p className="text-slate-400">Lägg till och redigera innehåll (demo)</p></div>
          <div className="grid sm:grid-cols-2 gap-4">
            {['Lägg till lag', 'Skapa scenario', 'Skapa quiz', 'Redigera lektion', 'Skapa flashcard', 'Hantera användare'].map(a => (
              <div key={a} className="card p-5 opacity-60">
                <h3 className="font-semibold mb-1">{a}</h3>
                <p className="text-sm text-slate-500">Tillgängligt i full version med backend</p>
              </div>
            ))}
          </div>
          <div className="card p-5">
            <h3 className="font-semibold mb-2">Nuvarande innehåll</h3>
            <ul className="text-sm text-slate-400 space-y-1">
              <li>• {LAWS.length} lagar med paragrafer</li>
              <li>• {SCENARIOS.length} scenarier</li>
              <li>• {FLASHCARDS.length} flashcards</li>
              <li>• {COURSES.length} kurser</li>
              <li>• {QUIZ_BANK.length} quizfrågor</li>
            </ul>
          </div>
        </div>
      );

      const pages = {
        home: renderHome,
        dashboard: renderDashboard,
        courses: renderCourses,
        quiz: renderQuiz,
        scenarios: renderScenarios,
        flashcards: renderFlashcards,
        laws: renderLaws,
        stats: renderStats,
        ai: renderAI,
        favorites: renderFavorites,
        search: renderSearch,
        admin: renderAdmin,
      };

      return (
        <div className="min-h-screen flex bg-slate-950">
          {/* Overlay */}
          {sidebar && <div className="fixed inset-0 bg-black/60 z-40 lg:hidden" onClick={() => setSidebar(false)} />}

          {/* Sidebar */}
          <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-64 bg-slate-900 border-r border-slate-800 transform transition-transform duration-300 ${sidebar ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
            <div className="flex flex-col h-full">
              <div className="p-5 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-police-500 to-police-700 flex items-center justify-center shadow-lg shadow-police-600/30">
                    <span className="text-white font-bold text-lg">P</span>
                  </div>
                  <div>
                    <h1 className="font-bold text-lg tracking-tight">PolisAkademin</h1>
                    <p className="text-xs text-slate-400">Polisjuridik</p>
                  </div>
                </div>
              </div>
              <div className="px-4 py-3 border-b border-slate-800 flex items-center gap-4 text-sm">
                <div className="flex items-center gap-1.5 text-amber-400"><Icon name="flame" size={16} /><span className="font-semibold">{progress.streak}</span></div>
                <div className="flex items-center gap-1.5 text-police-400"><Icon name="zap" size={16} /><span className="font-semibold">{progress.xp} XP</span></div>
                <div className="ml-auto text-xs bg-police-600/20 text-police-300 px-2 py-0.5 rounded-full">Nivå {progress.level}</div>
              </div>
              <nav className="flex-1 overflow-y-auto py-3 px-3 space-y-0.5">
                {nav.map(item => (
                  <button
                    key={item.id}
                    onClick={() => go(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${page === item.id ? 'bg-police-600/20 text-police-300 border border-police-500/30' : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800/60'}`}
                  >
                    <Icon name={item.icon} size={18} />
                    {item.label}
                  </button>
                ))}
              </nav>
              <div className="p-4 border-t border-slate-800 text-xs text-slate-500">© 2026 PolisAkademin</div>
            </div>
          </aside>

          {/* Main */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="lg:hidden sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
              <button onClick={() => setSidebar(true)} className="p-2 rounded-xl hover:bg-slate-800"><Icon name="menu" size={22} /></button>
              <span className="font-semibold">PolisAkademin</span>
              <div className="flex items-center gap-1 text-sm text-amber-400"><Icon name="flame" size={16} />{progress.streak}</div>
            </header>
            <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
              <div className="max-w-6xl mx-auto">
                {(pages[page] || pages.home)()}
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
