<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polisplugg</title>
<meta name="description" content="Plugga juridiken i polisprogrammets första termin med begreppskort, quiz, typfall och snabbspel.">
<meta name="theme-color" content="#0a3a8c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Polisplugg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#0f1b2d; --muted:#55627a; --line:#d3dae6;
  --blue:#0a3a8c; --on-blue:#ffffff; --accent-text:#0a3a8c;
  --hiviz:#d6e62e; --on-hiviz:#1a2400;
  --good:#1b7046; --good-bg:#e1f3e9; --bad:#b0322a; --bad-bg:#fbe6e3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0b121d; --surface:#141e2e; --ink:#e8edf5; --muted:#97a4ba; --line:#28354c;
  --blue:#2f62c9; --accent-text:#a3c0ff;
  --good:#58cf97; --good-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1917; color-scheme:dark } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(2rem,7vw,2.9rem)} h2{font-size:1.5rem}
p{margin:0}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em}
.muted{color:var(--muted)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:0}
.meters{display:flex;gap:8px;align-items:center}
.meter{font-family:var(--mono);font-size:.78rem;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.meter.streak{background:var(--hiviz);color:var(--on-hiviz);border-color:transparent;font-weight:500}
.batten{height:12px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue) 50%,var(--hiviz) 50%) 0 0/32px 6px repeat-x,
             linear-gradient(90deg,var(--hiviz) 50%,var(--blue) 50%) 0 6px/32px 6px repeat-x}
main{display:flex;flex-direction:column;gap:28px;padding-top:26px}
.intro{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.95rem;display:flex;gap:8px;align-items:baseline}
.chip small{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hiviz);color:var(--on-hiviz);border-color:transparent}
.chip[aria-pressed="true"] small{color:var(--on-hiviz)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--accent-text);transform:translateY(-2px)}
.mode b{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.1}
.mode span{color:var(--muted);font-size:.93rem;line-height:1.35}
.mode i{font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--accent-text);text-transform:uppercase;letter-spacing:.07em}
.prog{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.row .bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.row .bar div{height:100%;background:var(--blue);border-radius:999px;transition:width .4s}
.row .n,.count{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:62ch}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:6px 0;color:var(--accent-text);font-weight:600}
.track{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.track div{height:100%;background:var(--blue);transition:width .25s}
.stage{display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 16px;font-weight:600;min-height:50px}
.btn.primary{background:var(--blue);color:var(--on-blue);border-color:transparent}
.btn.ok{border-color:var(--good);color:var(--good)} .btn.no{border-color:var(--bad);color:var(--bad)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px} .btnrow.one{grid-template-columns:1fr}
.flip{perspective:1200px;background:none;border:0;padding:0;text-align:left;width:100%}
.flip .in{display:grid;transform-style:preserve-3d;transition:transform .45s}
.flip.on .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.face.b{transform:rotateY(180deg);border-color:var(--accent-text)}
.face .term{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.05;overflow-wrap:anywhere}
.face .def{font-size:1.15rem;line-height:1.4}
.ref{font-family:var(--mono);font-size:.78rem;color:var(--accent-text)}
.q{font-size:1.25rem;font-weight:600;line-height:1.3;text-wrap:balance}
.case{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:6px;padding:16px 18px;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.opt kbd{font-family:var(--mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;text-align:center;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent-text)} .opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)} .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{border-radius:var(--r);padding:14px 16px;font-size:.98rem}
.fb.right{background:var(--good-bg)} .fb.wrong{background:var(--bad-bg)}
.fb b{display:block;margin-bottom:2px} .fb.right b{color:var(--good)} .fb.wrong b{color:var(--bad)}
.timer{font-family:var(--display);font-weight:700;font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1}
.state{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:26px 20px;min-height:170px;display:flex;align-items:center;font-size:1.3rem;font-weight:500;line-height:1.3;transition:border-color .15s,background .15s}
.state.right{border-color:var(--good);background:var(--good-bg)} .state.wrong{border-color:var(--bad);background:var(--bad-bg)}
.btnrow.big .btn{min-height:68px;font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:.03em}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.92rem;line-height:1.3;min-height:62px;overflow-wrap:anywhere}
.tile.t{font-weight:600}
.tile.sel{border-color:var(--accent-text);box-shadow:inset 0 0 0 2px var(--accent-text)}
.tile.done{background:var(--good-bg);border-color:var(--good);color:var(--muted)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.score{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,16vw,5.5rem);line-height:.95;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted);font-weight:600}
.review,.list{display:flex;flex-direction:column;gap:10px}
.review article,.list article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.review article b{display:block;margin-bottom:4px}
.list article{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.list article span:last-child{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.nums b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:.85rem;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip div{aspect-ratio:1;border-radius:4px;background:var(--line)}
.strip .l1{background:color-mix(in srgb,var(--blue) 35%,var(--line))}
.strip .l2{background:color-mix(in srgb,var(--blue) 70%,var(--line))}
.strip .l3{background:var(--blue)}
.strip .today{outline:2px solid var(--hiviz);outline-offset:1px}
.codebox{display:flex;gap:8px;flex-wrap:wrap}
.codebox code,.codebox input{flex:1 1 240px;min-width:0;font-family:var(--mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-wrap:anywhere}
.status{font-family:var(--mono);font-size:.78rem}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .flip .in,.mode,.row .bar div,.track div{transition:none} .shake{animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home-btn" type="button">Polisplugg</button>
    <div class="meters">
      <span class="meter streak" id="m-streak" title="Dagar i rad"></span>
      <span class="meter" id="m-xp" title="Poäng"></span>
    </div>
  </header>
  <div class="batten" aria-hidden="true"></div>
  <main id="app"></main>
</div>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
